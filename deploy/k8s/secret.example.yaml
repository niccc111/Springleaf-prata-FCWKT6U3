# Template only — never commit real values. In a cluster this Secret is
# projected from a secrets manager (External Secrets Operator, AWS Secrets
# Manager CSI driver, or equivalent).
apiVersion: v1
kind: Secret
metadata:
  name: roe-secrets
  namespace: roe
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://roe:CHANGE_ME@roe-db.internal:5432/roe
  REDIS_URL: redis://roe-cache.internal:6379/0
  CELERY_BROKER_URL: redis://roe-cache.internal:6379/1
  CELERY_RESULT_BACKEND: redis://roe-cache.internal:6379/2
  JWT_SECRET_KEY: CHANGE_ME
  OMS_API_KEY: ''
  FMS_API_KEY: ''
  MAPPING_API_KEY: ''
  DELIVERY_PLATFORM_API_KEY: ''
