apiVersion: v1
kind: ConfigMap
metadata:
  name: roe-config
  namespace: roe
data:
  ENVIRONMENT: production
  DEBUG: 'false'
  API_V1_PREFIX: /api/v1

  # Integrations — switch to "http" and set the matching *_BASE_URL to go live.
  OMS_ADAPTER: mock
  FMS_ADAPTER: mock
  MAPPING_ADAPTER: mock
  DELIVERY_PLATFORM_ADAPTER: mock

  OPTIMISATION_WALL_CLOCK_LIMIT_SECONDS: '120'
  OPTIMISATION_SOLVER_LIMIT_SECONDS: '110'
  OPTIMISATION_PROGRESS_INTERVAL_SECONDS: '3'

  AUDIT_RETENTION_DAYS: '365'
  ROUTE_RETENTION_DAYS: '365'
  ALERT_RETENTION_DAYS: '90'
