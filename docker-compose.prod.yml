# Production stack for the Route Optimisation Engine on a single host
# (e.g. an AWS Lightsail Ubuntu VM).
#
#   cp backend/.env.prod.example backend/.env.prod   # then edit secrets
#   docker compose -f docker-compose.prod.yml --env-file backend/.env.prod up -d --build
#
# Only the frontend (nginx) is published to the host on port 80. It serves the
# built SPA and reverse-proxies /api and the WebSocket to the API container.
# Postgres and Redis stay on the internal network and are never exposed.

name: roe-prod

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      POSTGRES_DB: ${POSTGRES_DB:-roe}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-roe} -d ${POSTGRES_DB:-roe}']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    env_file: [./backend/.env.prod]
    environment:
      # Derived connection strings override any placeholders in the env file so
      # the app always talks to the in-network services.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-roe}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-roe}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ['celery', '-A', 'app.workers.celery_app.celery_app', 'worker', '--loglevel=info']
    env_file: [./backend/.env.prod]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-roe}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-roe}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      api: { condition: service_healthy }

  beat:
    build:
      context: ./backend
    restart: unless-stopped
    command: ['celery', '-A', 'app.workers.celery_app.celery_app', 'beat', '--loglevel=info']
    env_file: [./backend/.env.prod]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-roe}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-roe}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      api: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
