line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "ARG", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # FastAPI Depends() in defaults is idiomatic
    "RUF012",  # mutable class attrs on dataclasses/pydantic
    "SIM108",  # ternaries are not always clearer
    "ARG002",  # interface methods keep unused params for signature parity
    "RUF001",  # en dashes and unicode units (kg, m³) are intentional in prose
    "RUF002",
    "RUF003",
]

[lint.per-file-ignores]
# FastAPI dependency parameters exist to enforce auth/RBAC even when the handler
# body does not read them.
"app/api/**" = ["ARG001"]
"app/main.py" = ["ARG001"]
"alembic/versions/*" = ["E", "F", "I", "UP", "RUF"]
"tests/*" = ["ARG001", "ARG002", "B011", "SIM117"]
