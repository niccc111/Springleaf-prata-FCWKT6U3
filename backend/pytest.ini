[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = -q --strict-markers --tb=short
filterwarnings =
    ignore::DeprecationWarning
markers =
    property: Hypothesis property-based test for a design correctness property
    integration: exercises the database and/or the HTTP API
    slow: takes more than a few seconds
